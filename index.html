<!DOCTYPE html>
<html lang="id" data-tema="jingga" data-mode="terang">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidupku</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23d1430e'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EH%3C/text%3E%3C/svg%3E">
  <!-- Font tambahan. Kalau tidak ada internet, browser memakai font bawaan sistem. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/dasar.css">
  <link rel="stylesheet" href="css/tata-letak.css">
  <link rel="stylesheet" href="css/komponen.css">
  <link rel="stylesheet" href="css/halaman.css">
</head>
<body>

<div class="app">

  <!-- Bilah atas: merek, menu utama, aksi cepat dan profil. Di layar HP menu pindah ke bawah. -->
  <header class="topbar">
    <a class="merek" href="#beranda"><i class="logo" aria-hidden="true">H</i><span>Hidupku</span></a>

    <nav class="nav" aria-label="Menu utama">
      <a href="#beranda" data-hal="beranda">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span class="penuh">Beranda</span><span class="pendek">Beranda</span>
      </a>
      <a href="#jadwal" data-hal="jadwal">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="penuh">Jadwal</span><span class="pendek">Jadwal</span>
      </a>
      <a href="#keuangan" data-hal="keuangan">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l12-4v4"/><circle cx="17" cy="14" r="1"/></svg>
        <span class="penuh">Keuangan</span><span class="pendek">Uang</span>
      </a>
      <a href="#anggaran" data-hal="anggaran">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span class="penuh">Anggaran</span><span class="pendek">Budget</span>
      </a>
      <a href="#laporan" data-hal="laporan">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>
        <span class="penuh">Laporan</span><span class="pendek">Laporan</span>
      </a>
    </nav>

    <div class="aksi-atas">
      <button class="ikon-btn" type="button" data-aksi="fokusCatat" title="Catat cepat" aria-label="Catat cepat">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a class="ikon-btn" href="#inbox" data-hal="inbox" title="Kotak masuk" aria-label="Kotak masuk">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>
        <em class="lencana" id="lencanaInbox" hidden></em>
      </a>
      <a class="profil" href="#pengaturan" data-hal="pengaturan" id="profil" title="Pengaturan" aria-label="Pengaturan">
        <i class="avatar" aria-hidden="true" id="avatar"></i>
        <span class="profil-teks"><b id="profilNama"></b></span>
      </a>
    </div>
  </header>

  <div class="badan">
    <!-- Tombol terang dan gelap -->
    <aside class="rail" aria-label="Mode tampilan">
      <button type="button" data-aksi="mode" data-mode="terang" title="Mode terang" aria-label="Mode terang">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-aksi="mode" data-mode="gelap" title="Mode gelap" aria-label="Mode gelap">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </aside>

    <main class="utama">
      <!-- Kolom catat cepat: tampil di semua halaman -->
      <form id="formCatat" class="catat-wadah" autocomplete="off">
        <div class="catat">
          <input id="inputCatat" type="text" placeholder="Catat cepat, misalnya: geprek 15000" aria-label="Catat cepat">
          <button class="btn gelap" type="submit">Catat</button>
        </div>
        <p class="petunjuk">
          Contoh: <code>geprek 15000</code> &middot; <code>kopi 12rb</code><span class="opsi"> &middot;
          <code>+500000 uang saku</code> &middot; <code>saldo 250000</code></span>
        </p>
      </form>

      <section id="halaman"></section>
    </main>
  </div>
</div>

<!-- Jendela form untuk tambah dan ubah kegiatan atau transaksi -->
<dialog id="dlg">
  <form id="frm">
    <h3 id="dlgJudul"></h3>
    <div id="dlgIsi"></div>
    <div class="dlg-aksi">
      <button type="button" class="btn" data-aksi="tutupDlg">Batal</button>
      <button type="submit" class="btn primer" id="dlgOk">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Pesan singkat di bawah layar -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Input tersembunyi untuk memulihkan cadangan -->
<input type="file" id="berkasImpor" accept="application/json,.json" hidden>

<!-- Urutan penting: yang dipakai file lain dimuat lebih dulu -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/sinkron.js"></script>
<script src="js/hitung.js"></script>
<script src="js/parser.js"></script>
<script src="js/ui.js"></script>
<script src="js/dialog.js"></script>
<script src="js/halaman/beranda.js"></script>
<script src="js/halaman/jadwal.js"></script>
<script src="js/halaman/keuangan.js"></script>
<script src="js/halaman/anggaran.js"></script>
<script src="js/halaman/laporan.js"></script>
<script src="js/halaman/inbox.js"></script>
<script src="js/halaman/pengaturan.js"></script>
<script src="js/aksi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
